name: Deploy Construction Frontend

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/web/**'
  workflow_dispatch:  # Allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: apps/web/yarn.lock

      - name: Install dependencies
        run: cd apps/web && yarn install --frozen-lockfile

      - name: Create .env file with CloudFront HTTPS URL
        run: |
          cd apps/web
          echo "VITE_API_URL=https://d12e8wwao0hlhx.cloudfront.net/api/v1" > .env
          echo "VITE_SOCKET_URL=https://d12e8wwao0hlhx.cloudfront.net" >> .env
          echo "✅ Created .env file:"
          cat .env

      - name: Build frontend
        run: cd apps/web && yarn build

      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-north-1
        run: |
          echo "📦 Syncing to S3 bucket: construction-frontend-990521646564"
          aws s3 sync apps/web/dist/ s3://construction-frontend-990521646564/ \
            --delete \
            --cache-control "public, max-age=3600"

      - name: Invalidate CloudFront cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-north-1  # Changed from us-east-1 to eu-north-1
        run: |
          echo "🚀 Invalidating CloudFront cache for distribution: E2ZYHOCPS2ESA8"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id E2ZYHOCPS2ESA8 \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "✅ Invalidation created: $INVALIDATION_ID"
          
          # Wait for invalidation to complete (optional)
          echo "⏳ Waiting for invalidation to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id E2ZYHOCPS2ESA8 \
            --id $INVALIDATION_ID
          echo "✅ Cache invalidation complete!"

      - name: Verify deployment
        run: |
          echo "🎉 Frontend deployment completed successfully!"
          echo "🌐 CloudFront URL: https://d1q5gtvb1a02hf.cloudfront.net"
          echo "🌐 Custom Domain: https://cpromark.com"
          echo ""
          echo "📊 Deployment info:"
          echo "   - S3 Bucket: construction-frontend-990521646564"
          echo "   - CloudFront ID: E2ZYHOCPS2ESA8"
          echo "   - API URL: https://d12e8wwao0hlhx.cloudfront.net/api/v1"