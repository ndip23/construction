name: Deploy Backend to Elastic Beanstalk

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/api/**'
  workflow_dispatch:  # Allows manual trigger

env:
  NODE_VERSION: '20'
  EB_APPLICATION: pressing-prod
  EB_ENVIRONMENT: Pressing-prod-env
  EB_REGION: eu-north-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: apps/api/yarn.lock

      - name: Install dependencies
        working-directory: apps/api
        run: yarn install --frozen-lockfile

      - name: Run TypeScript type check
        working-directory: apps/api
        run: yarn tsc --noEmit

      - name: Build TypeScript
        working-directory: apps/api
        run: yarn build

      - name: Verify build output
        working-directory: apps/api
        run: |
          if [ ! -f "dist/server.js" ]; then
            echo "❌ Build failed: dist/server.js not found!"
            exit 1
          fi
          echo "✅ Build successful: dist/server.js exists"
          ls -la dist/

      - name: Create deployment package
        working-directory: apps/api
        run: |
          mkdir -p deploy-package
          cp -r dist deploy-package/
          cp package.json deploy-package/
          cp yarn.lock deploy-package/
          
          # Create Procfile if not exists
          if [ ! -f "Procfile" ]; then
            echo "web: node dist/server.js" > deploy-package/Procfile
          else
            cp Procfile deploy-package/
          fi
          
          cd deploy-package
          zip -r ../deploy.zip .
          cd ..
          rm -rf deploy-package
          
          echo "✅ Deployment package created"
          unzip -l deploy.zip | head -15

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ env.EB_APPLICATION }}
          environment_name: ${{ env.EB_ENVIRONMENT }}
          version_label: ${{ github.sha }}
          region: ${{ env.EB_REGION }}
          deployment_package: apps/api/deploy.zip
          wait_for_deployment: true
          wait_for_environment_recovery: 180

      - name: Verify deployment
        run: |
          echo "✅ Deployment completed!"
          echo "📊 Check status at:"
          echo "   https://${{ env.EB_REGION }}.console.aws.amazon.com/elasticbeanstalk/home?region=${{ env.EB_REGION }}#/environment/dashboard?environmentName=${{ env.EB_ENVIRONMENT }}"