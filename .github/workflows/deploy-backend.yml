name: Deploy Backend to Elastic Beanstalk

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/api/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd apps/api
          yarn install

      - name: Build TypeScript
        run: |
          cd apps/api
          yarn build

      - name: Create clean deployment package
        run: |
          cd apps/api
          mkdir -p deploy-package
          cp -r dist deploy-package/
          cp package.json deploy-package/
          cp yarn.lock deploy-package/
          cd deploy-package
          zip -r ../deploy.zip .
          cd ..
          rm -rf deploy-package
          echo "✅ Created deploy.zip with only dist/, package.json, yarn.lock"
          unzip -l deploy.zip | head -20

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: pressing-prod
          environment_name: Pressing-prod-env
          version_label: ${{ github.sha }}
          region: eu-north-1
          deployment_package: apps/api/deploy.zip