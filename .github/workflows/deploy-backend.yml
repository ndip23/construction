name: Deploy Backend to Elastic Beanstalk

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/api/**'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: apps/api/yarn.lock

      - name: Install dependencies
        working-directory: apps/api
        run: yarn install --frozen-lockfile

      - name: Build TypeScript
        working-directory: apps/api
        run: yarn build

      # CRITICAL VERIFICATION STEP
      - name: Verify build output
        working-directory: apps/api
        run: |
          if [ ! -f "dist/server.js" ]; then
            echo "❌ Build failed: dist/server.js not found!"
            echo "Contents of dist:"
            ls -la dist/ || echo "dist directory is empty or missing"
            exit 1
          fi
          echo "✅ Build successful: dist/server.js exists"
          echo "dist contents:"
          ls -la dist/

      # CREATE A CLEAN, LINUX-COMPATIBLE ZIP
      - name: Create deployment package
        working-directory: apps/api
        run: |
          # Create a fresh directory
          mkdir -p deploy-package
  
          # Copy only the necessary artifacts
          cp -r dist deploy-package/
          cp package.json deploy-package/
          cp yarn.lock deploy-package/
  
          # Create a Procfile to ensure EB knows how to start
          echo "web: node dist/server.js" > deploy-package/Procfile
  
          # Create the zip from within the directory to avoid path issues
          cd deploy-package
          zip -r ../deploy.zip .
          cd ..
  
          # Clean up
          rm -rf deploy-package
  
          echo "✅ Deployment package created"
          echo "Contents of deploy.zip:"
          unzip -l deploy.zip

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: pressing-prod
          environment_name: Pressing-prod-env
          version_label: ${{ github.sha }}
          region: eu-north-1
          deployment_package: apps/api/deploy.zip
          wait_for_deployment: true
          wait_for_environment_recovery: 180
      - name: Final status
        run: |
          echo "🎉 Deployment initiated! Check your environment at:"
          echo "https://eu-north-1.console.aws.amazon.com/elasticbeanstalk/home?region=eu-north-1#/environment/dashboard?environmentName=Pressing-prod-env"